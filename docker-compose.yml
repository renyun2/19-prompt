services:
  im-sdk:
    build: .
    container_name: im-sdk-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - im-sdk-data:/app/data
    networks:
      - im-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: im-sdk-redis
    ports:
      - "6379:6379"
    networks:
      - im-network

networks:
  im-network:
    driver: bridge

volumes:
  im-sdk-data:
